; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = phrog-mainboard
description = "Main firmware for the phrog pH instrument (nRF52840 Pro Micro + NAU7802)"
default_envs = main
boards_dir = boards

[env]
platform = nordicnrf52
; PlatformIO ships no nice!nano / Pro Micro board, so boards/nice_nano.json plus variants/nice_nano
; provide one on top of the Adafruit nRF52 core (the same Adafruit UF2 bootloader the nice!nano uses).
board = nice_nano
board_build.variants_dir = variants
build_src_flags = -Werror -Wall -Wdouble-promotion -Wclobbered -Wempty-body -Wuninitialized
build_flags = -Iinclude
framework = arduino
monitor_speed = 115200
check_tool = cppcheck, clangtidy
check_src_filters = +<src/*> +<test/*> +<lib/*> -<.pio/*>
check_flags =
	clangtidy: --checks=bugprone-*,clang-analyzer-*,cppcoreguidelines-*,misc-*,performance-*,portability-*,readability-*,-cppcoreguidelines-macro-usage,-cppcoreguidelines-avoid-magic-numbers,-readability-magic-numbers
	cppcheck: --enable=all --addon=misra.json --suppress=*:*/.pio/* --suppress=*:*/home/runner/.platformio/packages/* --suppress=unmatchedSuppression --suppress=cstyleCast
debug_tool = blackmagic
lib_deps =
	Wire

[env:main]
build_src_filter = +<*.hpp> +<main.cpp> +<device_setup.cpp>
test_build_src = true ; Allows device_setup.cpp to be used in tests

[env:debug]
build_type = debug
build_src_filter = +<*.hpp> +<main.cpp> +<device_setup.cpp>
test_build_src = true

; Bench example: cycles the measurement LEDs so the drive stages can be checked by eye.
[env:led_blink]
build_src_filter = +<*.hpp> +<examples/led_blink_main.cpp> +<device_setup.cpp>

; Bench example: photodiode ADC codes per channel, dark and lit, as a plain fixed-width table with a
; LOW/GOOD/HIGH verdict for trimpot adjustment. Works in any serial terminal.
[env:adc_monitor]
build_src_filter = +<*.hpp> +<examples/adc_monitor_main.cpp> +<device_setup.cpp>

; Same table redrawn in place with a coloured verdict column. monitor_raw passes the ANSI escapes
; through `pio device monitor -e adc_monitor_ansi_colored` unchanged.
[env:adc_monitor_ansi_colored]
build_src_filter = +<*.hpp> +<examples/adc_monitor_ansi_colored_main.cpp> +<device_setup.cpp>
monitor_raw = yes

; Bench example: logs every production sweep (same timing as `b`/`s`) plus thermistor and die
; temperature as CSV. Starts paused; send `r` to run and `p` to pause. For LED warm-up drift tests.
[env:drift_logger]
build_src_filter = +<*.hpp> +<examples/drift_logger_main.cpp> +<device_setup.cpp>

[env:mock_main]
build_src_filter = +<*.hpp> +<examples/mock_main.cpp>
test_build_src = true
test_filter =
	mock_tests/*
	test_phoenix_ble/test_ble_server
